name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 只依赖 Node 内置模块，无需 npm install
      - name: 语法 / 资源引用 / 外壳同步检查
        run: node scripts/check.mjs
