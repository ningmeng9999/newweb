        <!-- 主题预置：避免首帧闪白 / 闪错主题 -->
    <script>
    (function () {
        try {
            var mode = localStorage.getItem('lm_mode') || 'auto';
            if (['auto', 'dark', 'light'].indexOf(mode) === -1) mode = 'auto';
            var h = new Date().getHours();
            var theme = h < 6 ? 'dawn' : h < 12 ? 'morning' : h < 18 ? 'afternoon' : 'night';
            var root = document.documentElement;
            root.setAttribute('data-mode', mode);
            root.setAttribute('data-dark', mode === 'dark' ? 'true' : 'false');
            root.setAttribute('data-theme', theme);
        } catch (e) {}
    })();
    </script>
